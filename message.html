<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>留言板 · DY导航站</title>
  <meta name="description" content="DY导航站留言板,畅所欲言" />
  <link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>

  <!-- 动态壁纸背景层 -->
  <div id="bg-layer"></div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="index.html">
        <img class="logo-img" src="assets/网站左边标题图片.jpg" alt="DY导航站" />
        <span class="logo-text">DY导航站</span>
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="tools.html">工具导航</a>
        <a href="games.html">游戏导航</a>
        <a href="music.html">音乐</a>
        <a href="fun.html">趣事</a>
        <a href="message.html">留言板</a>
        <a href="chat.html">聊天</a>
        <a href="online-games.html">在线游戏</a>
        <a href="contact.html">联系社交</a>
      </div>
      <div class="nav-actions">
        <div class="bg-toggle-wrap">
          <button class="bg-toggle" id="bg-toggle" title="动态壁纸">🎨</button>
          <div class="bg-menu" id="bg-menu">
            <div class="bg-menu-title">视频壁纸</div>
            <button data-bg="auto">🎬 自动(按时间)</button>
            <button data-bg="day">☀️ 日间</button>
            <button data-bg="night">🌙 夜间</button>
            <div class="bg-menu-divider"></div>
            <div class="bg-menu-title">特效</div>
            <button data-bg="stars">🌌 星空</button>
            <button data-bg="petals">🌸 花瓣</button>
            <button data-bg="aurora">🌊 极光</button>
            <button data-bg="off">✖️ 关闭</button>
          </div>
        </div>
        <button class="theme-toggle" id="theme-toggle" title="切换深浅色">🌙</button>
        <button class="acct-nav" id="nav-login-btn" title="登录">👤 登录</button>
        <div class="acct-nav-user" id="nav-user" style="display:none;">
          <span class="acct-nav-name" id="nav-user-name"></span>
          <button class="acct-nav-logout" id="nav-logout-btn" title="退出登录">退出</button>
        </div>
      </div>
    </div>
  </nav>

  <header class="hero container" style="padding-bottom: 8px;">
    <h1>💬 留言板</h1>
    <p>畅所欲言,留下你的足迹 —— 留言保留 1 年,到期自动清空。</p>
  </header>

  <main class="container">
    <div id="msg-board" style="padding-top: 20px;">
      <!-- 留言表单 -->
      <form class="msg-form" id="msg-form">
        <div class="msg-form-row">
          <input class="msg-name-input" id="msg-name" type="text" maxlength="20" placeholder="匿名昵称(登录后自动署名)" autocomplete="off" />
          <button class="msg-submit" id="msg-submit" type="submit">✉️ 发表留言</button>
        </div>
        <textarea class="msg-textarea" id="msg-text" maxlength="300" rows="4" placeholder="说点什么吧…(最多 300 字)"></textarea>
        <div class="msg-form-hint">💡 留言保留 1 年;右上角可登录,登录后留言自动署名</div>
      </form>

      <!-- 留言列表 -->
      <div class="msg-list" id="msg-list"></div>
      <div class="empty" id="msg-empty" style="display:none;">
        <div class="big">📭</div>
        <p>还没有留言,快来抢沙发!</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>💬 DY导航站 · <a href="contact.html">联系我</a> 提出建议</p>
      <p style="margin-top:4px">© <span data-year></span> All rights reserved.</p>
    </div>
  </footer>

  <button class="back-top" id="back-top" title="回到顶部">↑</button>

  <script src="js/compat.js?v=11"></script>
  <script src="js/main.js?v=11"></script>
  <script src="js/background.js?v=11"></script>
  <script src="js/music.js?v=11"></script>
  <script src="js/listen-together.js?v=11"></script>
  <script src="js/easter.js?v=11"></script>
  <script src="js/notice.js?v=11"></script>
  <script src="js/account.js?v=11"></script>
  <script src="js/message.js?v=11"></script>
</body>
</html>
