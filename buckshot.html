<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恶魔轮盘 · DY导航站</title>
  <meta name="description" content="DY导航站恶魔轮盘:2-4 人联机霰弹枪轮盘赌,活到最后的人赢" />
  <link rel="stylesheet" href="css/style.css?v=14" />
</head>
<body>

  <!-- 动态壁纸背景层 -->
  <div id="bg-layer"></div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="index.html">
        <img class="logo-img" src="assets/网站左边标题图片.jpg" alt="DY导航站" />
        <span class="logo-text">DY导航站</span>
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="tools.html">工具导航</a>
        <a href="games.html">游戏导航</a>
        <a href="music.html">音乐</a>
        <a href="fun.html">趣事</a>
        <a href="message.html">留言板</a>
        <a href="chat.html">聊天</a>
        <a href="online-games.html">在线游戏</a>
        <a href="contact.html">联系社交</a>
      </div>
      <div class="nav-actions">
        <div class="bg-toggle-wrap">
          <button class="bg-toggle" id="bg-toggle" title="动态壁纸">🎨</button>
          <div class="bg-menu" id="bg-menu">
            <div class="bg-menu-title">视频壁纸</div>
            <button data-bg="auto">🎬 自动(按时间)</button>
            <button data-bg="day">☀️ 日间</button>
            <button data-bg="night">🌙 夜间</button>
            <div class="bg-menu-divider"></div>
            <div class="bg-menu-title">特效</div>
            <button data-bg="stars">🌌 星空</button>
            <button data-bg="petals">🌸 花瓣</button>
            <button data-bg="aurora">🌊 极光</button>
            <button data-bg="off">✖️ 关闭</button>
          </div>
        </div>
        <button class="theme-toggle" id="theme-toggle" title="切换深浅色">🌙</button>
        <button class="acct-nav" id="nav-login-btn" title="登录">👤 登录</button>
        <div class="acct-nav-user" id="nav-user" style="display:none;">
          <span class="acct-nav-name" id="nav-user-name"></span>
          <button class="acct-nav-logout" id="nav-logout-btn" title="退出登录">退出</button>
        </div>
      </div>
    </div>
  </nav>

  <header class="hero container" style="padding-bottom: 8px;">
    <a class="game-back" href="online-games.html">← 返回在线游戏</a>
    <h1>🔫 恶魔轮盘</h1>
    <p>2-4 人联机 · 实弹与空包的轮盘赌 · 活到最后的人赢 · 3 人以上解锁 逆转器🔄 / 手机📱</p>
  </header>

  <main class="container">
    <noscript><p style="color:var(--danger);font-weight:700">本游戏需要启用 JavaScript</p></noscript>

    <div class="br-wrap" id="br-app">

      <!-- 加入大厅 -->
      <div class="game-lobby" id="br-lobby">
        <div class="game-lobby-box">
          <div class="game-lobby-icon">🔫</div>
          <h3>恶魔轮盘 · 联机房间</h3>
          <p class="game-lobby-tip">2-4 人联机 · 创建房间后把 4 位房间号发给朋友</p>
          <div class="game-lobby-row">
            <input class="game-lobby-input" id="br-name" type="text" maxlength="12" placeholder="你的昵称(默认:玩家+编号)" autocomplete="off" />
            <button class="game-lobby-btn" id="br-create-btn" type="button">🏠 创建房间</button>
          </div>
          <div class="game-lobby-row" style="margin-top:8px;">
            <input class="game-lobby-input" id="br-room-input" type="text" maxlength="4" placeholder="输入 4 位房间号加入" autocomplete="off" />
            <button class="game-lobby-btn" id="br-join-btn" type="button">🔑 加入房间</button>
          </div>
          <div class="game-lobby-status" id="br-lobby-status"></div>
          <div class="br-lobby-players" id="br-lobby-players"></div>
          <button class="game-start-btn br-start" id="br-start-btn" type="button" style="width:100%;margin-top:14px;">开始游戏</button>
        </div>
      </div>

      <!-- 游戏房间 -->
      <div class="game-room" id="br-room" style="display:none;">
        <div class="br-roomcode" id="br-roomcode" style="display:none;"></div>
        <div class="game-top">
          <div class="game-info" id="br-info">等待游戏开始…</div>
        </div>

        <!-- 回合信息 -->
        <div class="br-round" id="br-round"></div>

        <!-- 玩家状态 -->
        <div class="br-players" id="br-players"></div>

        <!-- 弹仓 -->
        <div class="br-chamber" id="br-chamber"></div>

        <!-- 射击区 -->
        <div class="br-actions" id="br-actions"></div>

        <!-- 道具区 -->
        <div class="br-items" id="br-items"></div>

        <!-- 聊天 -->
        <div class="br-chat">
          <div class="br-log" id="br-log"></div>
          <div class="br-chat-row">
            <input class="chat-input" id="br-chat" type="text" maxlength="100" placeholder="说话…" autocomplete="off" />
            <button class="chat-send" id="br-chat-btn" type="button">发</button>
          </div>
        </div>
      </div>

      <!-- 结束弹窗 -->
      <div class="game-over-overlay" id="br-overlay" style="display:none;">
        <div class="game-over-box">
          <h3 id="br-over-title">🏁 游戏结束</h3>
          <div class="game-ranking" id="br-ranking"></div>
          <button class="game-over-btn" id="br-restart-btn" type="button">🔁 再来一局</button>
          <button class="game-over-close" id="br-over-close" type="button">关闭</button>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>🔫 DY导航站 · <a href="contact.html">联系我</a> 提出建议</p>
      <p style="margin-top:4px">© <span data-year></span> All rights reserved.</p>
    </div>
  </footer>

  <button class="back-top" id="back-top" title="回到顶部">↑</button>

  <script src="js/compat.js?v=14"></script>
  <script src="js/main.js?v=14"></script>
  <script src="js/background.js?v=14"></script>
  <script src="js/music.js?v=14"></script>
  <script src="js/listen-together.js?v=14"></script>
  <script src="js/easter.js?v=14"></script>
  <script src="js/notice.js?v=14"></script>
  <script src="js/account.js?v=14"></script>
  <script src="js/buckshot.js?v=14"></script>
</body>
</html>
